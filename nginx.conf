upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:4444;
}

# 1. Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name evenements.duckdns.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Handle HTTPS Traffic
server {
    listen 443 ssl;
    server_name evenements.duckdns.org;

    # SSL Certificates (Mapped from Host)
    ssl_certificate /etc/letsencrypt/live/evenements.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evenements.duckdns.org/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Limits
    client_max_body_size 10M;

    # Cache Next.js hashed static assets (safe - filename changes when content changes)
    location /_next/static/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy Config
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        set $method_action "$request_method$http_next_action";
        if ($method_action ~ "^POST.{1,9}$") {
            return 400;
        }
    }
}
