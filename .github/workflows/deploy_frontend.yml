name: Deploy Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build & Push Docker Image
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Note: We pass the API URL as a build-arg if your Dockerfile needs it for static generation
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .             # Root of your frontend repo
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/myapp-frontend:latest
          
      # 2. Update Nginx Config (Frontend owns Nginx usually)
      - name: Copy Nginx Config via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "nginx.conf"
          target: "/home/${{ secrets.SSH_USER }}/docker-app"

      # 3. Deploy via SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/docker-app
            
            # Pull ONLY the frontend image
            docker-compose pull frontend
            
            # Restart Frontend AND Nginx (since we might have updated nginx.conf)
            docker-compose up -d frontend nginx
            
            # Optional: Clean up old images
            docker image prune -f
