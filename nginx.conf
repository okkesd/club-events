upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:4444;
}

# 1. Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name evenements.duckdns.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Handle HTTPS Traffic
server {
    listen 443 ssl;
    server_name evenements.duckdns.org;

    # SSL Certificates (Mapped from Host)
    ssl_certificate /etc/letsencrypt/live/evenements.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evenements.duckdns.org/privkey.pem;

    # Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Limits
    client_max_body_size 10M;

    # Proxy Config (Same as before)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
